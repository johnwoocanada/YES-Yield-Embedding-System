<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="650" fill="url(#bg)"/>

  <text x="600" y="60"
        text-anchor="middle"
        fill="white"
        font-size="34"
        font-family="Arial"
        font-weight="bold">
    YES - Yield Embedding System
  </text>

  <text x="600" y="95"
        text-anchor="middle"
        fill="#cbd5e1"
        font-size="18"
        font-family="Arial">
    Semantic Positioning Framework Inspired by GPS
  </text>

  <!-- Input -->
  <rect x="70" y="240" width="220" height="110" rx="16"
        fill="url(#box)"/>

  <text x="180" y="285"
        text-anchor="middle"
        fill="white"
        font-size="26"
        font-family="Arial"
        font-weight="bold">
    Human Language
  </text>

  <text x="180" y="320"
        text-anchor="middle"
        fill="white"
        font-size="16"
        font-family="Arial">
    "Apple is a fruit"
  </text>

  <!-- Arrow -->
  <line x1="290" y1="295" x2="430" y2="295"
        stroke="#94a3b8"
        stroke-width="5"
        marker-end="url(#arrow)"/>

  <!-- YES Encoder -->
  <rect x="430" y="210" width="320" height="170" rx="18"
        fill="#111827"
        stroke="#06b6d4"
        stroke-width="3"/>

  <text x="590" y="265"
        text-anchor="middle"
        fill="#22d3ee"
        font-size="30"
        font-family="Arial"
        font-weight="bold">
    YES Encoder
  </text>

  <text x="590" y="305"
        text-anchor="middle"
        fill="white"
        font-size="18"
        font-family="Arial">
    Yield Embedding System
  </text>

  <text x="590" y="335"
        text-anchor="middle"
        fill="#cbd5e1"
        font-size="16"
        font-family="Arial">
    Transform Meaning into Coordinates
  </text>

  <!-- Arrow -->
  <line x1="750" y1="295" x2="890" y2="295"
        stroke="#94a3b8"
        stroke-width="5"
        marker-end="url(#arrow)"/>

  <!-- Semantic Space -->
  <rect x="890" y="170" width="250" height="250" rx="18"
        fill="#0f172a"
        stroke="#10b981"
        stroke-width="3"/>

  <text x="1015" y="225"
        text-anchor="middle"
        fill="#34d399"
        font-size="24"
        font-family="Arial"
        font-weight="bold">
    Semantic Space
  </text>

  <text x="1015" y="265"
        text-anchor="middle"
        fill="white"
        font-size="20"
        font-family="Arial">
    768 Dimensions
  </text>

  <text x="1015" y="300"
        text-anchor="middle"
        fill="#cbd5e1"
        font-size="15"
        font-family="Arial">
    [0.81, -0.24, ...]
  </text>

  <circle cx="980" cy="350" r="9" fill="#60a5fa"/>
  <circle cx="1030" cy="330" r="9" fill="#f59e0b"/>
  <circle cx="1080" cy="370" r="9" fill="#ef4444"/>

  <!-- Bottom explanation -->
  <line x1="600" y1="420" x2="600" y2="500"
        stroke="#94a3b8"
        stroke-width="4"
        marker-end="url(#arrow)"/>

  <rect x="260" y="500" width="680" height="95" rx="16"
        fill="#111827"
        stroke="#475569"
        stroke-width="2"/>

  <text x="600" y="545"
        text-anchor="middle"
        fill="white"
        font-size="24"
        font-family="Arial"
        font-weight="bold">
    GPS Locates Physical Objects
  </text>

  <text x="600" y="575"
        text-anchor="middle"
        fill="#34d399"
        font-size="24"
        font-family="Arial"
        font-weight="bold">
    YES Locates Semantic Meaning
  </text>
</svg>